name: HALAS external validation

on:
  push:
    branches: [master]
    paths:
      - "halas_external_validation.py"
      - "test_halas_external_validation.py"
      - ".github/workflows/halas_external_validation.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install analysis dependencies
        run: python -m pip install --upgrade pip numpy pandas scipy scikit-learn

      - name: Smoke test
        run: python test_halas_external_validation.py

      - name: Run full HALAS external validation
        run: python halas_external_validation.py --output_dir halas_external_validation_outputs

      - name: Print paper-facing result summary
        run: |
          cat halas_external_validation_outputs/headline_summary.txt
          echo
          cat halas_external_validation_outputs/halas_phenotype_summary.csv
          echo
          cat halas_external_validation_outputs/halas_association_tests.csv

      - name: Upload HALAS validation outputs
        uses: actions/upload-artifact@v4
        with:
          name: halas-external-validation
          path: halas_external_validation_outputs/
          if-no-files-found: error
